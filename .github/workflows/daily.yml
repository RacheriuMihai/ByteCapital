name: daily-bnr
on:
  schedule:
    - cron: "23 12 * * 1-5"   # UTC, după publicarea cursului BNR
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: pip install -r requirements.txt
      - run: python ingest/bnr.py
      - run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add data/fx_usd.csv && git commit -m "BNR fx update" || echo "no change"
          git push